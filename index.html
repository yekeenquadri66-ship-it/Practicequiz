<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Quiz</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="quiz-container">
    <!-- Quiz View -->
    <div id="quiz-view">
      <div class="header">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="stats">
          <span id="question-counter">Question 1 of 100</span>
          <span id="score-counter">Score: 0</span>
        </div>
      </div>

      <h2 id="question-text" class="question-title">Question text goes here</h2>

      <!-- Warning Message Container -->
      <div id="warning-msg" class="warning-msg hidden">
        <span>⚠️ Please select an answer before proceeding.</span>
      </div>

      <div id="options-container" class="options-grid">
        <!-- Options injected dynamically -->
      </div>

      <div class="quiz-controls">
        <button id="prev-btn" class="secondary-btn" onclick="prevQuestion()">Previous</button>
        <button id="next-btn" class="primary-btn" onclick="nextQuestion()">Next</button>
      </div>
    </div>

    <!-- Results View -->
    <div id="results-view" class="results-screen hidden">
      <h2>Quiz Completed!</h2>
      <div id="final-score" class="results-score">0%</div>
      <p id="results-summary">You answered 0 out of 100 questions correctly.</p>
      
      <div class="results-actions">
        <button id="retry-missed-btn" class="secondary-btn" onclick="retryMissedQuestions()">Retry Missed Questions</button>
        <button class="primary-btn" onclick="restartFullQuiz()">Restart Full Quiz</button>
      </div>
    </div>
  </div>

    <!-- First load the questions data -->
  <script src="questions.js"></script>
  
  <!-- Then load your main application logic -->
  <script src="script.js"></script>
</body>
</html>
